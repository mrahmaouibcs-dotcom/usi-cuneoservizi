services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prepesami
      POSTGRES_PASSWORD: prepesami
      POSTGRES_DB: prepesami
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepesami"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://prepesami:prepesami@db:5432/prepesami
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-cambiami}
      # un solo server: FastAPI serve anche la PWA candidato
      FRONTEND_DIR: /app/frontend
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8000}
      CORS_ORIGINS: http://localhost:8000
      # admin creato automaticamente al primo avvio
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@scuola.it}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-cambiami123}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    # init: crea tabelle + contenuti + admin, poi avvia il server
    command: sh -c "python -m scripts.init_db && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./backend:/app
      - ./frontend:/app/frontend:ro
    ports:
      - "8000:8000"

volumes:
  pgdata:
